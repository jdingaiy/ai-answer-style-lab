<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 回答样式实验室</title><meta name="description" content="实时编辑 Markdown，调整 AI 回答在 Web、App 搜索与卡片中的文字和间距。"><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="topbar"><div class="topbar-left"><div class="scene-switch"><label class="sr-only" for="scene">预览场景</label><select id="scene"><option value="web">Web · AI 搜索</option><option value="app">App · AI 搜索</option><option value="card">App · 搜索卡片</option></select></div><div class="version-switch"><label class="sr-only" for="version">参数版本</label><select id="version" aria-label="参数版本"></select><button id="save-version" type="button">保存版本</button><button id="share-version" type="button">分享版本</button><button id="delete-version" type="button" title="删除当前保存版本">删除</button></div></div><div class="header-actions"><button id="reset">重置当前场景</button><button id="export-jpg">导出预览 JPG</button><button id="export" class="primary">导出样式 CSS</button></div></header>
<main class="workspace">
<aside class="settings"><div id="controls"></div></aside>
<section class="content-panel"><nav class="content-tabs" role="tablist"><button class="content-tab active" data-tab="preview" role="tab">实时预览</button><button class="content-tab" data-tab="markdown" role="tab">编辑 Markdown</button><button class="content-tab" data-tab="css" role="tab">查看 CSS</button></nav><section class="tab-view active" data-view="preview"><div class="panel-heading"><h2>回答预览</h2><span class="preview-actions"><label class="measure-toggle"><input type="checkbox" id="measure"> 显示间距</label><label class="measure-toggle"><input type="checkbox" id="compare-toggle"> 对比旧版</label></span></div><div class="preview-stage"><div class="preview-frame" id="frame"><article class="markdown-body legacy-layer" id="answer-legacy"></article><article class="markdown-body current-layer" id="answer"></article><div class="compare-divider" id="compare-divider" aria-hidden="true"><span>拖动对比</span></div></div></div><div class="preview-footer"><span id="scene-status"></span><span>参数在此设备自动保留</span></div></section><section class="tab-view editor-panel" data-view="markdown"><div class="panel-heading"><h2>Markdown</h2><span id="char-count"></span></div><label class="sr-only" for="source">编辑 AI 回答的 Markdown 内容</label><textarea id="source" spellcheck="false"></textarea></section><section class="tab-view css-panel" data-view="css" aria-labelledby="css-heading"><div class="panel-heading"><h2 id="css-heading">CSS 样式预览</h2><button id="copy-css" type="button">复制 CSS</button></div><label class="sr-only" for="css-preview">当前场景的 CSS 样式（只读）</label><textarea id="css-preview" readonly spellcheck="false" wrap="off"></textarea></section></section>
</main><div id="notice" role="status" aria-live="polite"></div><style id="live-css"></style><script type="module" src="./app.js?v=20260911-jpg-export-v2"></script>
</body></html>
