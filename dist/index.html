<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 回答样式实验室</title><meta name="description" content="实时编辑 Markdown，调整 AI 回答在 Web、App 搜索与卡片中的文字和间距。"><link rel="stylesheet" href="./style.css"></head>
<body>
<header class="topbar"><div class="topbar-left"><div class="scene-switch"><label class="sr-only" for="scene">预览场景</label><select id="scene"><option value="web">Web · AI 搜索</option><option value="app">App · AI 搜索</option><option value="card">App · 搜索卡片</option></select></div><div class="version-switch"><label class="sr-only" for="version">参数版本</label><select id="version" aria-label="参数版本"></select><button id="save-version" type="button">保存版本</button><button id="share-version" type="button">分享版本</button><button id="delete-version" type="button" title="删除当前保存版本">删除</button></div></div><div class="header-actions"><button id="reset">重置当前场景</button><button id="export" class="primary">导出样式 CSS</button></div></header>
<main class="workspace">
<aside class="settings"><div id="controls"></div></aside>
<section class="editor-panel"><div class="panel-heading"><h2>Markdown</h2><span id="char-count"></span></div><label class="sr-only" for="source">编辑 AI 回答的 Markdown 内容</label><textarea id="source" spellcheck="false"></textarea><div class="editor-footer">编辑内容，即时预览 · 不调用 AI，不上传文本</div><section class="css-panel" aria-labelledby="css-heading"><div class="panel-heading"><h2 id="css-heading">CSS 样式预览</h2><button id="copy-css" type="button">复制 CSS</button></div><p class="css-hint" id="css-hint">随左侧参数实时更新 · 作用于 .markdown-body</p><label class="sr-only" for="css-preview">当前场景的 CSS 样式（只读）</label><textarea id="css-preview" readonly spellcheck="false" wrap="off" aria-describedby="css-hint"></textarea></section></section>
<section class="preview-panel"><div class="panel-heading"><h2>回答预览</h2><label class="measure-toggle"><input type="checkbox" id="measure"> 显示间距</label></div><div class="preview-stage"><div class="preview-frame" id="frame"><article class="markdown-body" id="answer"></article></div></div><div class="preview-footer"><span id="scene-status"></span><span>参数在此设备自动保留</span></div></section>
</main><div id="notice" role="status" aria-live="polite"></div><style id="live-css"></style><script type="module" src="./app.js"></script>
</body></html>
